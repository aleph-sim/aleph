[package]
name = "aleph-cli"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "aleph"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
aleph-core    = { path = "../aleph-core" }
aleph-ir      = { path = "../aleph-ir" }
aleph-parser  = { path = "../aleph-parser" }
aleph-backend = { path = "../aleph-backend" }
aleph-sv      = { path = "../aleph-sv" }
aleph-stab    = { path = "../aleph-stab" }
aleph-mps     = { path = "../aleph-mps" }
clap          = { workspace = true }
anyhow        = { workspace = true }
thiserror     = { workspace = true }
rand          = { workspace = true }

# Metal GPU backend (`--backend metal`). macOS-only and opt-in: build the CLI
# with `--features metal` on Apple Silicon to enable it; off by default so the
# default `aleph` binary needs no Metal toolchain and Linux builds are unaffected.
[target.'cfg(target_os = "macos")'.dependencies]
aleph-metal = { path = "../aleph-metal", optional = true }

# CUDA GPU backend (`--backend cuda` / `cuda-f32`). Linux+NVIDIA-only and opt-in:
# build with `--features cuda` on a CUDA host; off by default so the default
# `aleph` binary needs no CUDA toolkit and non-Linux builds are unaffected.
[target.'cfg(target_os = "linux")'.dependencies]
aleph-cuda = { path = "../aleph-cuda", optional = true }

[features]
# Wire the Metal GPU state-vector backend into the CLI. Pulls aleph-metal and
# turns on its `metal` feature. Only meaningful on macOS (the dep is target-gated).
metal = ["dep:aleph-metal", "aleph-metal/metal"]
# Wire the CUDA GPU state-vector backends (FP64 + FP32, in-core + paged) into the
# CLI. Pulls aleph-cuda and turns on its `cuda` feature. Linux-only (target-gated).
cuda = ["dep:aleph-cuda", "aleph-cuda/cuda"]

[dev-dependencies]
aleph-oracle = { path = "../aleph-oracle" }
assert_cmd   = { workspace = true }
predicates   = { workspace = true }
proptest     = { workspace = true }
