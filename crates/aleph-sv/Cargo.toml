[package]
name = "aleph-sv"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
## Exposes `aleph_sv::kernels` as `pub mod` for criterion benches that
## need direct kernel access (see `lib.rs`: `#[cfg(any(test, feature =
## "internal-bench"))] pub mod kernels`). Never enable in downstream crates.
internal-bench = []
## Forwards aleph-core's first-touch NUMA allocation into the SV backends.
## See docs/numa.md and P2-03.
numa = ["aleph-core/numa"]

[dependencies]
aleph-core    = { path = "../aleph-core" }
aleph-ir      = { path = "../aleph-ir" }
aleph-backend = { path = "../aleph-backend" }
rand          = { workspace = true }
smallvec      = { workspace = true }
rayon         = { workspace = true }

[dev-dependencies]
aleph-parser = { path = "../aleph-parser" }
aleph-test   = { path = "../aleph-test" }
proptest     = { workspace = true }
criterion    = { workspace = true }

[[bench]]
name = "naive_sv"
harness = false

[[bench]]
name = "sample"
harness = false

[[bench]]
name = "expectation"
harness = false

[[bench]]
name = "soa_vs_naive"
harness = false

[[bench]]
name = "pauli_xy"
harness = false
required-features = ["internal-bench"]

[[bench]]
name = "multi_controlled"
harness = false
