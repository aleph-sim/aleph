[package]
name = "aleph-metal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Metal GPU foundation for the aleph quantum circuit simulator (macOS only)."

[features]
default = []
# Enables the real Metal backend. Off by default so `cargo build --workspace`
# stays an empty-crate compile on Linux and on default macOS.
metal = [
    "dep:metal",
    "dep:bytemuck",
    "dep:thiserror",
    "dep:aleph-backend",
    "dep:aleph-core",
    "dep:aleph-ir",
    "dep:aleph-oracle",
    "dep:rand",
    "dep:num-complex",
]

[dependencies]
thiserror = { workspace = true, optional = true }
# Backend trait + IR + Complex live in pure-Rust workspace crates; optional so
# they are only compiled when the `metal` feature is on (always macOS-only).
aleph-backend = { path = "../aleph-backend", optional = true }
aleph-core    = { path = "../aleph-core", optional = true }
aleph-ir      = { path = "../aleph-ir", optional = true }
# `aleph-oracle` provides the `HasAmplitudes` trait the Metal state implements.
# Normal (optional) dep — NOT dev-only — because the impl is a real public
# capability used by the integration oracle test, and an external-trait impl
# must live in this crate (orphan rule). Workspace-internal + feature-gated to
# macOS+metal, so it never weighs on Linux/default builds.
aleph-oracle  = { path = "../aleph-oracle", optional = true }
rand          = { workspace = true, optional = true }
# `bytemuck` feature makes `Complex<f32>: Pod`, so `DeviceBuffer<Complex<f32>>`
# works directly and the kernel sees a `device float2*`.
num-complex   = { workspace = true, optional = true, features = ["bytemuck"] }

# `metal` is macOS-only: target-cfg the dep so it is never resolved on Linux,
# even transitively, regardless of feature selection.
[target.'cfg(target_os = "macos")'.dependencies]
metal    = { version = "0.33", optional = true }
bytemuck = { workspace = true, optional = true, features = ["derive"] }

[dev-dependencies]
# `NaiveSvBackend` is the f64 reference for the FP32 oracle test.
aleph-sv = { path = "../aleph-sv" }
proptest = { workspace = true }
# Tier-1 circuit builders (ghz/qft/random brickwall) reused by the
# fused-vs-unfused tests and the sv_fused bench, plus the OpenQASM parser for
# the Grover fixture (no in-Rust Grover builder exists).
aleph-benches = { path = "../../benches" }
aleph-parser  = { path = "../aleph-parser" }
criterion = { workspace = true }

# Metal fused-vs-unfused bench (P5.5-04). macOS+Metal only, so gated behind the
# `metal` feature — `cargo bench --workspace` and Linux skip it. Run explicitly:
#   cargo bench -p aleph-metal --features metal --bench sv_fused
[[bench]]
name = "sv_fused"
harness = false
required-features = ["metal"]

# Tier-1 GPU-vs-CPU exit bench (P5.5-05). macOS+Metal only — same gating as
# sv_fused. Run explicitly on the M4 Mac Mini:
#   cargo bench -p aleph-metal --features metal --bench sv_vs_cpu
[[bench]]
name = "sv_vs_cpu"
harness = false
required-features = ["metal"]
