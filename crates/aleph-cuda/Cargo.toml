[package]
name = "aleph-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "CUDA GPU foundation for the aleph quantum circuit simulator (Linux + NVIDIA only)."
# build.rs links libcustatevec, but only when the `cuquantum` feature is on
# (it no-ops otherwise), so the default build needs no CUDA/cuQuantum present.
build = "build.rs"

[features]
default = []
# Enables the real CUDA backend. Off by default so `cargo build --workspace`
# stays an empty-crate compile on macOS and on default Linux — symmetric with
# `aleph-metal`'s `metal` feature. The physics (statevector, gate kernels)
# lands in later Phase 5 tickets; this crate is plumbing only (P5-01).
cuda = [
    "dep:cudarc",
    "dep:thiserror",
    "dep:aleph-backend",
    "dep:aleph-core",
    "dep:aleph-ir",
    "dep:aleph-oracle",
    "dep:aleph-qec",
    "dep:rand",
    "dep:smallvec",
]
# cuStateVec (cuQuantum) backend (P5-03). Superset of `cuda`: adds nothing but
# the hand-written FFI in `src/cuquantum`, whose symbols `build.rs` links against
# `libcustatevec`. Optional + off by default so it is built/tested only on a host
# with cuQuantum installed (the RTX 4000 Ada box), never in CI.
cuquantum = ["cuda"]

[dependencies]
thiserror = { workspace = true, optional = true }
# Backend trait + IR + Complex/Pauli live in pure-Rust workspace crates; optional
# so they compile only under `cuda` (Linux+NVIDIA only).
aleph-backend = { path = "../aleph-backend", optional = true }
aleph-core    = { path = "../aleph-core", optional = true }
aleph-ir      = { path = "../aleph-ir", optional = true }
# `aleph-oracle` provides the `HasAmplitudes` trait the CUDA state implements
# (external-trait impl must live here, orphan rule). Workspace-internal +
# feature-gated, so it never weighs on default/macOS builds.
aleph-oracle  = { path = "../aleph-oracle", optional = true }
# The GPU Union-Find decoder (Q3-01) consumes an `aleph-qec` matching graph and is oracle-checked
# against its CPU `UnionFindDecoder`. Optional + feature-gated like the other workspace deps.
aleph-qec     = { path = "../aleph-qec", optional = true }
rand          = { workspace = true, optional = true }
smallvec      = { workspace = true, optional = true }

# `cudarc` is Linux+NVIDIA-only: target-cfg the dep so it is never resolved off
# Linux (mirrors aleph-metal gating `metal` to macOS), even transitively.
#
# Feature choices (see P5-01 rationale in the PR):
#  - `dynamic-loading`: dlopen libcuda at runtime — the GPU code path compiles
#    with NO CUDA SDK present, so CI on the (CUDA-less) self-hosted Linux runner
#    can build `--features cuda`. The actual GPU round-trip test runs on the
#    RTX 4000 Ada box.
#  - `cuda-13000`: pin the bindings to CUDA 13.0 (the toolkit installed on the
#    GPU box; its 580-series driver caps at the 13.0 runtime).
#  - `driver`: the driver API (alloc / memcpy / free) is all P5-01 needs. cuBLAS,
#    cuRAND, NVRTC, runtime API come in later tickets when kernels need them.
[target.'cfg(target_os = "linux")'.dependencies]
cudarc = { version = "0.19.8", default-features = false, features = [
    "std",
    "driver",
    "nvrtc",
    "cuda-13000",
    "dynamic-loading",
], optional = true }

# Dev-deps for the oracle test (Tier-1 GPU vs CPU). The test body is gated on
# `feature = "cuda"`, so these only do real work under `--features cuda`; pure
# Rust, so they never pull CUDA in.
[dev-dependencies]
aleph-backend = { path = "../aleph-backend" }
aleph-core    = { path = "../aleph-core" }
aleph-ir      = { path = "../aleph-ir" }
aleph-oracle  = { path = "../aleph-oracle" }
aleph-sv      = { path = "../aleph-sv" }
aleph-stab    = { path = "../aleph-stab" }
aleph-qec     = { path = "../aleph-qec" }
rand          = { workspace = true }
