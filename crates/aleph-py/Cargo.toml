[package]
name = "aleph-py"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# `cdylib` is required for maturin / PyO3 to produce a Python-loadable module.
# `rlib` kept so the crate is still consumable from other workspace members.
crate-type = ["cdylib", "rlib"]

[features]
# Enables the PyO3 extension module. OFF by default so `cargo build --workspace`
# never needs a Python interpreter; `maturin develop --features python` turns it on.
python = ["dep:pyo3", "dep:numpy", "dep:rand"]
# Wire the Metal GPU state-vector backend (`backend="metal"`) into the Python
# `run()`. macOS-only (the dep is target-gated); build the wheel with
# `maturin develop --features python,metal` on Apple Silicon.
metal = ["dep:aleph-metal", "aleph-metal/metal"]

[dependencies]
aleph-core    = { path = "../aleph-core" }
aleph-ir      = { path = "../aleph-ir" }
aleph-backend = { path = "../aleph-backend" }
aleph-sv      = { path = "../aleph-sv" }
aleph-mps     = { path = "../aleph-mps" }
aleph-parser  = { path = "../aleph-parser" }
aleph-stab    = { path = "../aleph-stab" }
smallvec      = { workspace = true }
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py312"], optional = true }
# Returns the state vector to Python as a contiguous numpy complex128 array
# (P4-11), avoiding 2^n boxed PyComplex objects. Version tracks the pyo3 0.22
# line — rust-numpy 0.22 is the matching release.
numpy = { version = "0.22", optional = true }
# Needed by the run(noise=, seed=None) path (run.rs) to draw a u64 seed from
# OS entropy; declared here so the follow-up wiring has no Cargo.toml churn.
# Pulled in only with the `python` feature.
rand = { workspace = true, optional = true }

# Metal GPU backend for `backend="metal"`. macOS-only; pulled in only with the
# `metal` feature (off by default, so default/Linux wheels are unaffected).
[target.'cfg(target_os = "macos")'.dependencies]
aleph-metal = { path = "../aleph-metal", optional = true }
