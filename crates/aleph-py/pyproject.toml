[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "aleph-sim"
dynamic = ["version"]
description = "High-performance quantum circuit simulator in Rust: state-vector, MPS, and stabilizer backends"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/ruslan-splynx/aleph"
Benchmarks = "https://github.com/ruslan-splynx/aleph/blob/main/docs/perf/parity.md"

[tool.maturin]
features = ["python"]
module-name = "aleph"
