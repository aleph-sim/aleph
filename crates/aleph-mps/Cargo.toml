[package]
name = "aleph-mps"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aleph-core = { path = "../aleph-core" }
aleph-backend = { path = "../aleph-backend" }
aleph-ir = { path = "../aleph-ir" }
nalgebra = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
faer = { version = "0.24.0", default-features = false, features = ["linalg", "std"] }

[features]
# faer's rayon-parallel kernels. Off by default: parallelism only wins at
# large bond dimensions (chi >= ~512 measured on EPYC 16c; 1.54x at chi=512),
# and is a large pessimization at typical chi <= 256. Enable for
# wide-bond workloads and control threads via RAYON_NUM_THREADS.
parallel = ["faer/rayon"]

[dev-dependencies]
aleph-sv = { path = "../aleph-sv" }
aleph-parser = { path = "../aleph-parser" }
proptest = { workspace = true }
smallvec = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "nn_qaoa"
harness = false

[[bench]]
name = "long_range"
harness = false

# NOTE: `required-features` makes `cargo bench --workspace` skip this bench
# silently (the P1-09 lesson) — deliberate here: its purpose is the parallel
# thread sweep, and the always-on cells would otherwise add minutes of
# saturating CPU to every push-to-main Bench run on the shared EPYC runner.
# Run it explicitly: cargo bench -p aleph-mps --features parallel --bench wide_bond
[[bench]]
name = "wide_bond"
harness = false
required-features = ["parallel"]
