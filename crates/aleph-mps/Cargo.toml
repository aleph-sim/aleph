[package]
name = "aleph-mps"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aleph-core = { path = "../aleph-core" }
aleph-backend = { path = "../aleph-backend" }
aleph-ir = { path = "../aleph-ir" }
nalgebra = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
faer = { version = "0.24.0", default-features = false, features = ["linalg", "std"] }

[features]
default = ["parallel"]
# faer's rayon-parallel kernels. Safe ON by default since P3-13: every faer
# call chooses Par per-operation from the measured size threshold
# (src/linalg.rs PAR_MIN_ELEMS), so small-bond ops always run sequentially
# (chi <= 256 was a 1.5x-19x pessimization under the old process-global
# control plane) and only wide-bond operands (> 2^18 elements, chi ~ 512)
# enter the rayon pool (1.52x @16T on EPYC at chi=512). Thread count:
# RAYON_NUM_THREADS. Disable with default-features = false for a rayon-free
# build. Unification caveat for external users: enabling this feature compiles
# faer/rayon into the whole build graph, so OTHER crates' direct high-level
# faer calls will see a rayon global default — only aleph-mps's own calls are
# size-thresholded.
parallel = ["faer/rayon"]

[dev-dependencies]
aleph-sv = { path = "../aleph-sv" }
aleph-parser = { path = "../aleph-parser" }
proptest = { workspace = true }
smallvec = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "nn_qaoa"
harness = false

[[bench]]
name = "long_range"
harness = false

# NOTE: `parallel` is a default feature since P3-13, so required-features no
# longer skips this bench in `cargo bench --workspace`. A runtime env guard
# (WIDE_BOND=1) inside the bench keeps the sweep cells out of push-to-main
# Bench runs on the shared EPYC runner; WIDE_BOND_CHI512=1 additionally
# enables the ~47 s/iter chi=512 cell.
[[bench]]
name = "wide_bond"
harness = false
required-features = ["parallel"]

[[bench]]
name = "parity"
harness = false

[[bench]]
name = "swap_dense"
harness = false
