[package]
name = "aleph-benches"
edition.workspace = true
rust-version.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lib]
# Empty placeholder lib so the crate is well-formed without an explicit
# `src/main.rs`; benches live under `benches/`.
path = "src/lib.rs"

[features]
# Opt-in gate for the P2-01 parallel-scaling bench (`qft_scaling`). Kept
# out of the default set so `cargo bench --workspace` / CI skip its
# expensive n=25 (512 MiB) runs; enable explicitly for deliberate EPYC
# scaling sweeps.
scaling-bench = []

[dependencies]
aleph-core    = { path = "../crates/aleph-core" }
aleph-ir      = { path = "../crates/aleph-ir" }
aleph-backend = { path = "../crates/aleph-backend" }
aleph-sv      = { path = "../crates/aleph-sv" }
aleph-parser  = { path = "../crates/aleph-parser" }
smallvec      = { workspace = true }

[[bin]]
name = "oneshot"
path = "src/bin/oneshot.rs"

[dev-dependencies]
criterion = { workspace = true }

# Disable the default test/bench harness so criterion can take over.
# See https://bheisler.github.io/criterion.rs/book/getting_started.html
[[bench]]
name = "bell"
harness = false

[[bench]]
name = "ghz"
harness = false

[[bench]]
name = "qft"
harness = false

[[bench]]
name = "random"
harness = false

[[bench]]
name = "qiskit_baseline"
harness = false

[[bench]]
name = "p1_07_microbench"
harness = false

[[bench]]
name = "qft_scaling"
harness = false
required-features = ["scaling-bench"]

[[bench]]
name = "tier1_scaling"
harness = false
required-features = ["scaling-bench"]

[[bench]]
name = "diagonal_fusion"
harness = false
required-features = ["scaling-bench"]

[[bench]]
name = "fuse_kq"
harness = false
required-features = ["scaling-bench"]

[[bench]]
name = "qft_precision"
harness = false
required-features = ["scaling-bench"]

[[bench]]
name = "cache_blocking"
harness = false
required-features = ["scaling-bench"]
