name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  merge_group:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Plan affected checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.plan.outputs.docs }}
      fmt: ${{ steps.plan.outputs.fmt }}
      clippy: ${{ steps.plan.outputs.clippy }}
      linux: ${{ steps.plan.outputs.linux }}
      macos: ${{ steps.plan.outputs.macos }}
      python: ${{ steps.plan.outputs.python }}
      hardware: ${{ steps.plan.outputs.hardware }}
      python_os: ${{ steps.plan.outputs.python_os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test planner, command coverage and fail-closed gate
        run: python -m unittest discover -s scripts/ci -v
      - name: Select checks from complete diff and Cargo consumer graph
        id: plan
        run: python scripts/ci/plan.py
      - uses: actions/upload-artifact@v4
        with:
          name: ci-plan
          path: ci-plan.json
          if-no-files-found: error

  docs:
    name: Documentation and report checks
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/ci/docs.py

  fmt:
    name: rustfmt
    needs: plan
    if: needs.plan.outputs.fmt == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - run: python3 scripts/ci/run.py fmt

  clippy:
    name: clippy
    needs: plan
    if: needs.plan.outputs.clippy == 'true'
    # The trust decision is in the workflow, never in the PR's generated plan.
    # Forks get hosted execution and cannot claim a self-hosted label.
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/ci/run.py clippy

  linux:
    name: test linux ${{ matrix.toolchain }}
    needs: plan
    if: needs.plan.outputs.linux == 'true'
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    # Beta is explicitly blocking: previous merge instructions required its
    # success even though continue-on-error could make a failed matrix green.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: python3 scripts/ci/run.py linux --toolchain "$RUSTUP_TOOLCHAIN"

  python:
    name: test python ${{ matrix.python }}
    needs: plan
    if: needs.plan.outputs.python == 'true'
    # Map to fixed hosted labels; a fork-controlled output is never a runner label.
    runs-on: ${{ needs.plan.outputs.python_os == 'macos-latest' && 'macos-latest' || 'ubuntu-latest' }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install maturin
      - name: Build feature-appropriate consumer wheel
        run: python scripts/ci/run.py python
      - name: Install wheel and test dependencies
        run: pip install dist/*.whl stim sinter pymatching
      - name: Public benchmark contracts and CPU CLI route
        run: |
          cargo build --locked -p aleph-cli --release
          ALEPH_BENCH_TEST_CLI="$PWD/target/release/aleph" python -m unittest discover -s scripts/benchmarks -v
      - name: Run binding tests
        run: python -m unittest discover -s scripts/python -v

  macos:
    name: test macos ${{ matrix.toolchain }}
    needs: plan
    if: needs.plan.outputs.macos == 'true'
    runs-on: macos-latest
    # Cold release workspace/tests plus Metal/consumer feature checks exceeded
    # 30m on run 39162811229; preserve all checks with a bounded 45m budget.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Preserve release platform coverage; Linux keeps debug assertions.
      - run: python3 scripts/ci/run.py macos --toolchain "$RUSTUP_TOOLCHAIN"

  hardware:
    name: RTL
    needs: plan
    if: needs.plan.outputs.hardware == 'true'
    uses: ./.github/workflows/hw.yml
    permissions:
      contents: read

  required:
    name: ci-required
    needs: [plan, docs, fmt, clippy, linux, python, macos, hardware]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
      - name: All selected groups must have succeeded
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/gate.py
