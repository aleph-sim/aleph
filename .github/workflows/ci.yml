name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Trusted-PR guard: self-hosted runners must not execute code from
# untrusted forks. Pushes to our own branches and PRs from this repo's
# branches are trusted; fork PRs skip self-hosted jobs.
# See: https://docs.github.com/en/actions/security-guides/security-hardening-for-github-actions#hardening-for-self-hosted-runners
# The guard is inlined per-job because workflow-level `env` is not in
# scope for job-level `if:` expressions.

jobs:
  fmt:
    name: rustfmt
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check

  clippy:
    name: clippy
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # P5-01: aleph-cuda is an empty crate without the `cuda` feature, so the
      # workspace clippy above never sees its GPU code. Lint it explicitly with
      # the feature on. `cudarc`'s `dynamic-loading` means this compiles with no
      # CUDA SDK on the runner; the actual GPU test runs on the RTX 4000 box.
      - name: clippy aleph-cuda (cuda feature)
        run: cargo clippy -p aleph-cuda --features cuda --all-targets -- -D warnings

  test-linux:
    name: test linux ${{ matrix.toolchain }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    env:
      # `rust-toolchain.toml` pins `channel = "stable"` and rustup honours
      # it on every `cargo` invocation inside the repo, which would silently
      # override the matrix toolchain. `RUSTUP_TOOLCHAIN` takes precedence
      # over the file, so the beta row actually runs on beta.
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace
      # Since P3-13 the `parallel` feature (faer/rayon) is ON by default, so
      # the workspace run above already covers the rayon build (including the
      # cfg-gated thread-invariance oracle). This step keeps the rayon-FREE
      # build compiling and green instead — the configuration users get with
      # `default-features = false` (P1-09 silent-skip class).
      - name: test aleph-mps without default features
        run: cargo test -p aleph-mps --no-default-features
      # P5-01: ensure the CUDA GPU code path compiles. `cudarc` `dynamic-loading`
      # needs no CUDA SDK at build time, so the (GPU-less) runner can build it;
      # the round-trip test itself runs on the RTX 4000 Ada box, not here. Stable
      # only — beta adds no signal for this and would just double the load.
      - name: build aleph-cuda (cuda feature)
        if: matrix.toolchain == 'stable'
        run: cargo build -p aleph-cuda --features cuda

  test-python:
    name: test python
    # Trusted-PR guard mirrors the Rust jobs (see header). The job itself runs
    # on a GitHub-hosted runner — it must NOT add load to the self-hosted box.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      # Warm the Rust dep tree so the maturin build is the only cold cost.
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install maturin
      # `features = ["python"]` comes from `[tool.maturin]` in pyproject.toml.
      # build + pip-install (not `maturin develop`, which needs an active
      # virtualenv that setup-python does not provide) mirrors release.yml.
      - name: Build the wheel
        run: maturin build --release -m crates/aleph-py/Cargo.toml --out dist
      - name: Install the wheel
        run: pip install dist/*.whl
      # The suite import-guards on `aleph`, so a build/install failure surfaces
      # here as a hard error rather than silently-skipped tests.
      - name: Run binding tests
        run: python -m unittest discover -s scripts/python -v

  test-macos:
    name: test macos ${{ matrix.toolchain }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          # The metal-feature clippy step below is the first clippy run in this
          # job. The runner's preinstalled stable ships clippy, but the
          # action-installed beta toolchain does not — declare it so both rows
          # have cargo-clippy.
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # macOS (macos-latest, GitHub-hosted) is ~2x slower than the self-hosted
      # Linux runner, and the debug aleph-qec suite (heavy circuit-level DEM
      # construction) alone runs ~24 min there — over the 30-min cap. This job
      # runs in RELEASE for platform coverage; the Linux job above keeps the
      # debug profile, so overflow/debug_assert coverage is not lost.
      - run: cargo build --workspace --release
      - run: cargo test --workspace --release
      # P5.5-01: the aleph-metal crate is empty without this feature, so the
      # workspace steps above only prove the empty-crate compile. These build
      # and exercise the real Metal path. The smoke test skips gracefully when
      # the runner exposes no Metal device, so the leg stays green either way.
      - name: Build aleph-metal (metal feature)
        run: cargo build -p aleph-metal --features metal --release
      - name: Test aleph-metal (metal feature)
        run: cargo test -p aleph-metal --features metal --release
      - name: Clippy aleph-metal (metal feature)
        run: cargo clippy -p aleph-metal --features metal --all-targets -- -D warnings
