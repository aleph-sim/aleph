name: Bench

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "benches/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/bench.yml"

# Concurrency: serialise every bench run on the single self-hosted
# runner. Two concurrent `cargo bench` invocations would fight for
# memory and `target/` locks and produce noisy numbers — the whole
# point of dedicated bench hardware is stable measurements. We accept
# the throughput hit (one bench at a time, queued FIFO) in exchange.
# Runs are never cancelled mid-flight so bencher.dev's main-branch
# baseline keeps every commit's measurement.
concurrency:
  group: bench-self-hosted-linux-x64
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write  # bencher posts a results comment on PRs

jobs:
  bench:
    name: bench (self-hosted linux/x64)
    # Same trusted-PR guard as ci.yml — never run benches from a fork
    # on our self-hosted runner.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    env:
      BENCHER_PROJECT: aleph
      BENCHER_TESTBED: self-hosted-linux-x64
      BENCHER_ADAPTER: rust_criterion
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      # Gate that bench harness compiles. Today there are no benches,
      # so this is effectively a no-op; once P0-04 adds `benches/`, any
      # compile regression here blocks the PR before the runs below.
      - name: Compile bench harness
        run: cargo bench --workspace --no-run

      # Upload to bencher.dev only when real criterion benches exist.
      # Until P0-04 lands `benches/`, `cargo bench --workspace` emits
      # unit-test output (no benches → 0 passed; 0 measured), which the
      # `rust_criterion` adapter can't parse and the bencher API rejects.
      # The `hashFiles` check returns "" when no matching files exist.
      - name: Install bencher CLI
        if: hashFiles('benches/**/*.rs', 'crates/*/benches/**/*.rs') != ''
        uses: bencherdev/bencher@main

      - name: Run benches and upload to bencher.dev
        if: hashFiles('benches/**/*.rs', 'crates/*/benches/**/*.rs') != ''
        env:
          # Repo secret is stored under the name `BENCHER`; the bencher
          # CLI reads it from the env var `BENCHER_API_TOKEN`.
          BENCHER_API_TOKEN: ${{ secrets.BENCHER }}
          # Pass the GH token via env (not argv) so it doesn't end up in
          # /proc/<pid>/cmdline on the shared self-hosted runner.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `--err` intentionally omitted: bencher would otherwise turn any
        # threshold breach (configured in the bencher.dev UI) into a hard
        # PR-blocking gate silently, without a code change. When thresholds
        # become part of the merge contract we'll add it back explicitly.
        run: |
          bencher run \
            --project "$BENCHER_PROJECT" \
            --branch "${{ github.head_ref || github.ref_name }}" \
            --testbed "$BENCHER_TESTBED" \
            --adapter "$BENCHER_ADAPTER" \
            --github-actions "$GH_TOKEN" \
            -- cargo bench --workspace
