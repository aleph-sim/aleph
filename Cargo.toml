[workspace]
resolver = "2"
# Members are enumerated explicitly rather than via `crates/*` glob: a glob
# treats every matched path as a package and errors if any subdirectory under
# `crates/` lacks a Cargo.toml (scratch dirs, worktrees, build caches).
members = [
    "crates/aleph-core",
    "crates/aleph-ir",
    "crates/aleph-parser",
    "crates/aleph-backend",
    "crates/aleph-sv",
    "crates/aleph-mps",
    "crates/aleph-stab",
    "crates/aleph-oracle",
    "crates/aleph-cli",
    "crates/aleph-py",
    "crates/aleph-test",
    "benches",
]

[workspace.package]
edition = "2021"
# Bumped from 1.75 to 1.85 in P0-04 (criterion 0.5's transitive deps).
# Bumped from 1.85 to 1.89 in P1-03 — AVX-512 intrinsics (`_mm512_*`,
# stabilised in 1.89.0, 2025-08-07) are used by the hand-written SIMD
# kernel at `crates/aleph-sv/src/kernels/aos.rs` (`apply_1q_avx512`).
# CLAUDE.md tracks the same floor; bump both together if SIMD or
# another dep pushes it again.
rust-version = "1.89"
version = "0.0.0"
license = "MIT"
repository = "https://github.com/ruslan-splynx/aleph"
authors = ["aleph contributors"]

[workspace.dependencies]
# Shared dependencies are declared here and inherited per-crate via
# `foo.workspace = true`. Add new entries as crates start using them
# (e.g. thiserror, rayon) so versions stay aligned across the workspace.
num-complex = "0.4"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "html_reports", "plotters"] }
smallvec = "1"
rayon = "1.10"
thiserror = "1"
proptest = "1"
nom = "7"
nom_locate = "4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
assert_cmd = "2"
predicates = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
# `line-tables-only` keeps flamegraphs readable without the DWARF-quality
# pitfalls of full `debug = true` under ThinLTO (rust-lang/rust#60059, #90357).
debug = "line-tables-only"
